# first_scenario.yaml - A simple radar tracking scenario for beginners
scenario:
  name: "Getting Started - First Radar Simulation"
  description: "Track a commercial aircraft with a ground-based radar"
  duration: 30.0  # seconds
  time_step: 0.1  # seconds

# Define the radar system
radar:
  type: "pulse_doppler"
  parameters:
    frequency: 10.0e9     # 10 GHz (X-band)
    power: 1000.0         # 1 kW transmit power
    antenna_gain: 35.0    # dB
    pulse_width: 1.0e-6   # 1 microsecond
    prf: 1000             # Pulse Repetition Frequency (Hz)
    bandwidth: 1.0e6      # 1 MHz
    noise_figure: 3.0     # dB
    losses: 3.0           # dB

  processing:
    range_resolution: 150     # meters
    max_range: 50000          # meters (50km)
    velocity_resolution: 1.0  # m/s
    n_doppler_bins: 256
    detection_threshold: 13.0 # dB SNR
    cfar_guard_cells: 3
    cfar_training_cells: 10

  tracking:
    filter_type: "kalman"
    max_tracks: 10
    track_initiation_threshold: 3
    track_termination_threshold: 5

# Define targets
targets:
  - name: "Commercial-Flight-001"
    type: "aircraft"
    initial_position: [30.0, 15.0, 10.0]  # km [x, y, z]
    velocity: [-200.0, -50.0, 0.0]        # m/s
    rcs: 100.0                            # m² (typical for large aircraft)

# Environmental conditions
environment:
  temperature: 15.0     # Celsius
  pressure: 1013.25     # hPa
  humidity: 60          # percent
  weather: "clear"
  terrain: "flat"
  rain_rate: 0.0        # mm/hr

# Clutter settings
clutter:
  enabled: false

# Output configuration
output:
  save_figures: true
  save_data: true
  output_dir: "results/getting_started"
  data_format: "json"
  metrics:
    - "detection_probability"
    - "false_alarm_rate"
    - "track_accuracy"
    - "track_continuity"
